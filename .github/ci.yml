name: CI

on:
  push:
    braches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-lastes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnmp/actions-setup@v3
        with:
          version: '10.29.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (typecheck + bundle)
        run: pnpm build

      - name: Test
        run: pnpm test:run
